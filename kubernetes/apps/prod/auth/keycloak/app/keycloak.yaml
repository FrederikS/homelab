apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
spec:
  # Number of instances in the cluster
  instances: 1
  # External Database connection
  db:
    vendor: postgres
    host: postgres-keycloak-rw
    port: 5432
    database: app
    usernameSecret:
      name: postgres-keycloak-app
      key: username
    passwordSecret:
      name: postgres-keycloak-app
      key: password
  # Bootstrap admin account
  bootstrapAdmin:
    user:
      secret: keycloak-secret
  # Enabling HTTP communications
  # Keycloak behing HTTP Proxy closing TLS connections
  http:
    httpEnabled: true
  hostname:
    # Setting hostname
    hostname: "https://iam.${SECRET_DOMAIN}/"
    strict: true
    # Enabling back channel
    backchannelDynamic: false
  proxy:
    headers: xforwarded # double check your reverse proxy sets and overwrites the X-Forwarded-* headers
  # Do not create ingress
  # TLS options are not supported. Ingress resource to be created separatedly.
  ingress:
    enabled: false
  # Additional Options
  # KC_* server options belong here, JVM flags belong in env/JAVA_OPTS_APPEND below.
  additionalOptions: []
  # JVM flags for the Keycloak server process, appended by kc.sh.
  env:
    # CVE-2026-114938 "Java4Shell": out-of-bounds write in the AVX-512 VBMI
    # Base64 intrinsic (OpenJDK >= 17.0.6, x86-64 only). No node in this cluster
    # exposes avx512vbmi, so the vulnerable intrinsic is never selected, but
    # this keeps Keycloak safe if it is ever scheduled onto AVX-512 hardware.
    # Drop once the keycloak image ships a patched JDK.
    - name: JAVA_OPTS_APPEND
      value: "-XX:-UseBASE64Intrinsics"
  unsupported:
    podTemplate:
      spec:
        nodeSelector:
          kubernetes.io/arch: amd64
        containers:
          - volumeMounts:
              - name: backup-nfs
                mountPath: /mnt/backup
        volumes:
          - name: backup-nfs
            persistentVolumeClaim:
              claimName: backup-nfs-${APP}
